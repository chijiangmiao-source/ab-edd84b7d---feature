name: deep-space-audit

services:
  app:
    build: .
    image: deep-space-audit:local
    environment:
      PORT: "8080"
    ports:
      # health check and API are served on the configurable host port
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot acceptance service: runs build checks, code tests and HTTP
  # smoke tests against app, then exits with the verdict as its exit code.
  verify:
    image: deep-space-audit:local
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8080
    command: ["python", "-m", "verify.verify"]
    restart: "no"
